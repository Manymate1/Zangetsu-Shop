<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style/layout.css">
    <link rel="stylesheet" href="style/content.css">
    <link rel="stylesheet" href="style/images.css">
    <link rel="icon" href="img/Bleach.png">

</head>
<body>
    
    <!-- Cabecera -->

    <header>

        <div class="title">

            <img src="img/Zanpakto.png" alt="Logo de Zangetsu shop">
            <h1>Zangetsu shop</h1>

        </div>

        <nav class="header-nav">
        
            <p>Tienda | Comunidad | Biblioteca</p>

            <p>
                <img src="img/futa.jpeg" alt="Perfil" class="profile">
                Perfil
            </p>

            <p>Buscar en la tienda</p>

        </nav>

    </header>

    <!-- Centro -->

    <main>

    <div class="main-content">

        <section class="content">

            <article>

                <img src="img/persona5.webp" alt="Persona 5 Royal" class="card">

                <h5>Persona 5 royal</h5>
                <p>67.000 Cop</p> 

            </article>

            <article>

                <img src="img/persona3.jpg" alt="Persona 3 Reload" class="card">
                
                <h5>Persona 3 Reload</h5>
                <p>70.000</p>

            </article>

            <article>

                <img src="img/bloodborne.webp" alt="Bloodborne" class="card">
                <h5>Bloodborne</h5>
                <p>100.000</p>

            </article>

        </section>

        <section class="content">

            <article>

                <img src="img/persona6.jpg" alt="Persona 6" class="long-card" class="centro">      
                <h2>Persona 6</h2>
                <p>150.000</p>

            </article>

    </main>

</body>
</html>
